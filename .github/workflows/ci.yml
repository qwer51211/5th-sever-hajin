name: CI

# main, develop으로 push되거나, 이들로 PR이 올라올 때 자동 실행
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest   # 깃허브가 제공하는 리눅스 가상머신에서 실행

    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트 실행
        run: ./gradlew build